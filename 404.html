<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/icons/favicon.png">
<title>404 - Səhifə Tapılmadı</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #131315;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 90px 90px;
    pointer-events: none;
    z-index: 1;
  }

  .glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 45%);
    pointer-events: none;
    z-index: 2;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: block;
  }

  .content {
    position: relative;
    z-index: 4;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .code-404 {
    font-size: 42px;
    letter-spacing: 18px;
    font-weight: 300;
    color: transparent;
    margin-bottom: 210px;
  }

  .back-home {
    margin-top: 210px;
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.3px;
    pointer-events: all;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.25s ease;
  }

  .back-home:hover {
    color: rgba(255,255,255,0.9);
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow"></div>

<div class="content">
  <div class="code-404">404</div>
  <a href="/" class="back-home">Əsas səhifəyə qayıt</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const sphereGroup = new THREE.Group();
sphereGroup.position.set(0, 0, 0);
scene.add(sphereGroup);

function createParticleShell(radius, count, thickness, size, color, breakAmount = 0) {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    let r = radius + (Math.random() - 0.5) * thickness;

    const topFactor = Math.max(0, 1 - phi / (Math.PI * 0.35));
    if (breakAmount > 0 && topFactor > 0) {
      const crackNoise = Math.sin(theta * 3.0 + 1.5) * 0.5 + Math.sin(theta * 7.0) * 0.3;
      const crackMask = Math.pow(topFactor, 2) * Math.max(0, crackNoise);
      r -= crackMask * breakAmount * radius;
      r += (Math.random() - 0.5) * crackMask * breakAmount * radius * 0.6;
    }

    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color: color, size: size, transparent: true, opacity: 0.9,
    sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geometry, material);
  points.userData.originalPositions = positions.slice();
  points.userData.radius = radius;

  const scatterOffsets = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const idx = i * 3;
    const px = positions[idx], py = positions[idx + 1], pz = positions[idx + 2];
    const len = Math.sqrt(px * px + py * py + pz * pz) || 1;
    const distance = radius * (0.7 + Math.random() * 1.6);
    const jitter = radius * 0.35;
    scatterOffsets[idx] = (px / len) * distance + (Math.random() - 0.5) * jitter;
    scatterOffsets[idx + 1] = (py / len) * distance + (Math.random() - 0.5) * jitter;
    scatterOffsets[idx + 2] = (pz / len) * distance + (Math.random() - 0.5) * jitter;
  }
  points.userData.scatterOffsets = scatterOffsets;
  return points;
}

function createTextParticles(text, worldWidth, z, color, size) {
  const canvas = document.createElement("canvas");
  canvas.width = 1000;
  canvas.height = 300;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffffff";
  ctx.font = "300 190px Montserrat, -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 10);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const step = 2.4;
  const coords = [];
  for (let y = 0; y < canvas.height; y += step) {
    for (let x = 0; x < canvas.width; x += step) {
      const px = Math.floor(x), py = Math.floor(y);
      const alpha = imageData[(py * canvas.width + px) * 4 + 3];
      if (alpha > 120) {
        coords.push(
          x + (Math.random() - 0.5) * step,
          y + (Math.random() - 0.5) * step
        );
      }
    }
  }

  const count = coords.length / 2;
  const scale = worldWidth / canvas.width;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (coords[i * 2] - canvas.width / 2) * scale;
    positions[i * 3 + 1] = -(coords[i * 2 + 1] - canvas.height / 2) * scale;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color: color, size: size, transparent: true, opacity: 0.9,
    sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geometry, material);
  points.userData.originalPositions = positions.slice();

  const scatterOffsets = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const idx = i * 3;
    const px = positions[idx], py = positions[idx + 1], pz = positions[idx + 2];
    const len = Math.sqrt(px * px + py * py + pz * pz) || 1;
    const distance = 1.8 + Math.random() * 3.2;
    const jitter = 1.0;
    scatterOffsets[idx] = (px / len) * distance + (Math.random() - 0.5) * jitter;
    scatterOffsets[idx + 1] = (py / len) * distance + (Math.random() - 0.5) * jitter;
    scatterOffsets[idx + 2] = (pz / len) * distance + (Math.random() - 0.5) * jitter * 2;
  }
  points.userData.scatterOffsets = scatterOffsets;
  points.position.z = z;
  return points;
}

const outerShell = createParticleShell(3.4, 9000, 0.28, 0.028, 0xffffff, 0.22);
const innerSphere = createParticleShell(1.35, 5500, 1.2, 0.03, 0xffffff, 0.12);
const dustField = createParticleShell(4.6, 1200, 1.6, 0.018, 0x999999, 0);

sphereGroup.add(dustField);
sphereGroup.add(outerShell);
sphereGroup.add(innerSphere);

const textParticles = createTextParticles("404", 8.5, 0, 0xffffff, 0.032);
textParticles.position.y = 5.6;
scene.add(textParticles);

outerShell.userData.rotationSpeed = { x: 0.0008, y: 0.0015, z: 0.0003 };
innerSphere.userData.rotationSpeed = { x: -0.0013, y: 0.002, z: -0.0006 };
dustField.userData.rotationSpeed = { x: 0.0002, y: -0.0005, z: 0.0002 };

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const mouseNDC = new THREE.Vector2(-10, -10);
window.addEventListener("mousemove", (e) => {
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
window.addEventListener("mouseleave", () => { mouseNDC.set(-10, -10); });

const hitTestGeometry = new THREE.SphereGeometry(3.7, 16, 16);
const hitTestMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const hitTestSphere = new THREE.Mesh(hitTestGeometry, hitTestMaterial);
scene.add(hitTestSphere);

const raycaster = new THREE.Raycaster();
let targetCamX = 0, targetCamY = 0;
let targetLookX = 0, targetLookY = 0;
let currentLookX = 0, currentLookY = 0;
const EXPLODE_LERP = 0.055;

function applyExplode(points, exploded) {
  const positions = points.geometry.attributes.position.array;
  const original = points.userData.originalPositions;
  const scatter = points.userData.scatterOffsets;
  for (let i = 0; i < positions.length; i += 3) {
    positions[i]     += ((exploded ? original[i] + scatter[i] : original[i]) - positions[i]) * EXPLODE_LERP;
    positions[i + 1] += ((exploded ? original[i + 1] + scatter[i + 1] : original[i + 1]) - positions[i + 1]) * EXPLODE_LERP;
    positions[i + 2] += ((exploded ? original[i + 2] + scatter[i + 2] : original[i + 2]) - positions[i + 2]) * EXPLODE_LERP;
  }
  points.geometry.attributes.position.needsUpdate = true;
}

let hue = 0;
const HUE_SPEED = 0.0004;

function updateColors() {
  hue = (hue + HUE_SPEED) % 1;
  outerShell.material.color.setHSL(hue, 0.75, 0.62);
  innerSphere.material.color.setHSL(hue, 0.75, 0.62);
  dustField.material.color.setHSL(hue, 0.45, 0.5);
  textParticles.material.color.setHSL(hue, 0.75, 0.62);
}

function animate() {
  requestAnimationFrame(animate);
  updateColors();
  outerShell.rotation.x += outerShell.userData.rotationSpeed.x;
  outerShell.rotation.y += outerShell.userData.rotationSpeed.y;
  outerShell.rotation.z += outerShell.userData.rotationSpeed.z;
  innerSphere.rotation.x += innerSphere.userData.rotationSpeed.x;
  innerSphere.rotation.y += innerSphere.userData.rotationSpeed.y;
  innerSphere.rotation.z += innerSphere.userData.rotationSpeed.z;
  dustField.rotation.x += dustField.userData.rotationSpeed.x;
  dustField.rotation.y += dustField.userData.rotationSpeed.y;

  raycaster.setFromCamera(mouseNDC, camera);
  const isHovering = raycaster.intersectObject(hitTestSphere).length > 0;
  applyExplode(outerShell, isHovering);
  applyExplode(innerSphere, isHovering);
  applyExplode(textParticles, isHovering);

  if (mouseNDC.x > -5) {
    targetCamX = mouseNDC.x * 0.55;
    targetCamY = mouseNDC.y * 0.35;
    targetLookX = mouseNDC.x * 2.2;
    targetLookY = mouseNDC.y * 1.3;
  } else {
    targetCamX = 0;
    targetCamY = 0;
    targetLookX = 0;
    targetLookY = 0;
  }

  camera.position.x += (targetCamX - camera.position.x) * 0.025;
  camera.position.y += (targetCamY - camera.position.y) * 0.025;
  currentLookX += (targetLookX - currentLookX) * 0.025;
  currentLookY += (targetLookY - currentLookY) * 0.025;
  camera.lookAt(currentLookX, currentLookY, 0);
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
