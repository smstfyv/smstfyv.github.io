<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b8bf0"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1d4fc4"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      <![CDATA[
        .card {
          transform-box: fill-box;
        }

        #ambientGlow {
          animation: ambientPulse 4s ease-in-out infinite;
          transform-box: fill-box;
          transform-origin: center;
        }
        @keyframes ambientPulse {
          0%, 100% { opacity: 0.5; transform: scale(0.92); }
          50%      { opacity: 1;   transform: scale(1.08); }
        }

        #emsarText {
          opacity: 0;
          animation: revealWord 3.6s cubic-bezier(.22,1,.36,1) infinite;
        }
        #groupText {
          opacity: 0;
          animation: revealWordSmall 3.6s cubic-bezier(.22,1,.36,1) infinite;
          animation-delay: 0.32s;
        }
        @keyframes revealWord {
          0%   { opacity: 0; letter-spacing: 30px; }
          18%  { opacity: 1; letter-spacing: 6px; }
          82%  { opacity: 1; letter-spacing: 6px; }
          100% { opacity: 0; letter-spacing: 6px; }
        }
        @keyframes revealWordSmall {
          0%   { opacity: 0; letter-spacing: 18px; }
          18%  { opacity: 1; letter-spacing: 5px; }
          82%  { opacity: 1; letter-spacing: 5px; }
          100% { opacity: 0; letter-spacing: 5px; }
        }

        #divider {
          transform-box: fill-box;
          transform-origin: left center;
          transform: scaleX(0);
          opacity: 0;
          animation: lineGrow 3.6s cubic-bezier(.22,1,.36,1) infinite;
          animation-delay: 0.55s;
        }
        @keyframes lineGrow {
          0%   { transform: scaleX(0); opacity: 0; }
          25%  { opacity: 1; }
          40%  { transform: scaleX(1); opacity: 1; }
          80%  { transform: scaleX(1); opacity: 1; }
          100% { transform: scaleX(0); opacity: 0; }
        }

        #spinnerGroup {
          opacity: 0;
          animation: barFade 3.6s ease-in-out infinite;
          animation-delay: 0.6s;
        }
        @keyframes barFade {
          0%   { opacity: 0; }
          14%  { opacity: 0; }
          22%  { opacity: 1; }
          88%  { opacity: 1; }
          100% { opacity: 0; }
        }

        #spinnerArc {
          transform-box: fill-box;
          transform-origin: center;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          0%   { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

      ]]>
    </style>
  </defs>

  <!-- ambient glow behind logo -->
  <circle id="ambientGlow" cx="320" cy="150" r="130" fill="url(#glowGrad)" filter="url(#softBlur)"/>

  <!-- EMSAR -->
  <text id="emsarText" x="320" y="160" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="800" fill="url(#goldGrad)">EMSAR</text>

  <!-- divider -->
  <rect id="divider" x="260" y="188" width="120" height="2.5" rx="1.25" fill="url(#goldGrad)"/>

  <!-- GROUP -->
  <text id="groupText" x="320" y="228" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="300" fill="#9db8f0">GROUP</text>

  <!-- loading spinner -->
  <g id="spinnerGroup" transform="translate(320,300)">
    <circle r="18" stroke="#2a3142" stroke-width="4" fill="none"/>
    <circle id="spinnerArc" r="18" stroke="#ffffff" stroke-width="4" fill="none"
            stroke-linecap="round" stroke-dasharray="34 79"/>
  </g>
</svg>
